<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить рыбалку - FishLog</title>
</head>
<body>
    <header>
        <a href="fishings.html">FishLog</a>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Выйти</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Добавить рыбалку</h1>
        
        <form action="#" method="post">
            <p>
                <label for="date">Дата</label>
                <input type="date" id="date" name="date" required>
            </p>
            
            <p>
                <label for="place">Место</label>
                <input type="text" id="place" name="place">
            </p>

            <p>
                <label for="temperature">Температура</label>
                <input type="number" id="temperature" name="temperature" step="any" aria-describedby="temperature-unit">
                <span id="temperature-unit">°C</span>
            </p>

            <p>
                <label for="pressure">Давление</label>
                <input type="number" id="pressure" name="pressure" aria-describedby="pressure-unit">
                <span id="pressure-unit">мм рт. ст.</span>
            </p>

            <p>
                <label for="wind-direction">Направление ветра</label>

                <select name="wind-direction" id="wind-direction" required>
                    <option value="">Выберите направление</option>
                    <option value="north">Север</option>
                    <option value="northeast">Северо-Восток</option>
                    <option value="east">Восток</option>
                    <option value="southeast">Юго-Восток</option>
                    <option value="south">Юг</option>
                    <option value="southwest">Юго-Запад</option>
                    <option value="west">Запад</option>
                    <option value="northwest">Северо-Запад</option>

                </select>
            </p>

            <p>
                <label for="wind-speed">Скорость ветра</label>
                <input type="number" id="wind-speed" name="wind-speed" step="any" aria-describedby="wind-speed-unit">
                <span id="wind-speed-unit">м/с</span>
            </p>

            <p>
                <label for="weather">Погода</label>
                <input type="text" id="weather" name="weather">
            </p>

            <button type="submit">Сохранить</button>
            <button type="reset">Очистить</button>
            <a href="fishings.html">Отмена добавления</a>
        </form>
    </main>

    <footer>
        <p>© 2026 FishLog</p>
        <nav>
            <ul>
                <li>
                    <a href="#">Telegram</a>
                </li>
                <li>
                    <a href="#">VK</a>
                </li>
            </ul>
        </nav>
    </footer>

</body>
</html>
