<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/base.css">
    <link rel="stylesheet" href="/style/app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/style/entry.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Новая рыбалка - FishLog</title>
</head>
<body>
    <header class="topbar">
        <a class="logo" href="fishings.html">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12c4-6 11-6 15 0-4 6-11 6-15 0zM18 12l4-4v8z" />
                <circle cx="8" cy="11" r="1" />
            </svg>
            FishLog
        </a>

        <nav class="topnav" aria-label="Основная навигация">
            <ul>
                <li><a href="fishings.html">Журнал</a></li>
                <li><a href="calendar.html">Календарь</a></li>
                <li><a href="catches.html">Уловы</a></li>
            </ul>
        </nav>

        <div class="topbar__side">
            <a class="btn" href="add-fishing.html">Новая рыбалка</a>
            <a class="avatar" href="profile.html" aria-label="Профиль">АК</a>
        </div>
    </header>

    <main class="page page--narrow">
        <h1>Новая рыбалка</h1>

        <form class="entry" action="#" method="post">
            <div class="form-grid form-grid--2">
                <div class="tile">
                    <label for="date">Дата</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="tile">
                    <label for="time">Время</label>
                    <input type="time" id="time" name="time">
                </div>
            </div>

            <div class="tile">
                <label for="place">Место</label>
                <input type="text" id="place" name="place" placeholder="Озеро Вуокса, северный берег" required>
            </div>

            <fieldset class="weather">
                <legend>Погода</legend>
                <div class="weather__options">
                    <input type="radio" id="w-clear" name="weather" value="clear">
                    <label for="w-clear">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>
                        Ясно
                    </label>

                    <input type="radio" id="w-cloud" name="weather" value="cloud" checked>
                    <label for="w-cloud">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 10 1 3.5 3.5 0 0 1 0 7z"/></svg>
                        Облачно
                    </label>

                    <input type="radio" id="w-rain" name="weather" value="rain">
                    <label for="w-rain">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14a4 4 0 0 1 0-8 5 5 0 0 1 10 1 3.5 3.5 0 0 1 0 7zM8 18l-1 3M13 18l-1 3M18 18l-1 3"/></svg>
                        Дождь
                    </label>
                </div>
            </fieldset>

            <div class="form-grid form-grid--4">
                <div class="tile">
                    <label for="air">Воздух, °C</label>
                    <input type="number" id="air" name="air" step="0.1" placeholder="+9">
                </div>
                <div class="tile">
                    <label for="water">Вода, °C</label>
                    <input type="number" id="water" name="water" step="0.1" placeholder="+8">
                </div>
                <div class="tile">
                    <label for="wind">Ветер, м/с</label>
                    <input type="number" id="wind" name="wind" step="0.1" min="0" placeholder="3">
                </div>
                <div class="tile">
                    <label for="pressure">Давление, мм</label>
                    <input type="number" id="pressure" name="pressure" placeholder="748">
                </div>
            </div>

            <div class="form-grid form-grid--2">
                <div class="tile">
                    <label for="lure">Приманка</label>
                    <input type="text" id="lure" name="lure" placeholder="Воблер 90 мм">
                </div>
                <div class="tile">
                    <label for="catch">Улов</label>
                    <input type="text" id="catch" name="catch" placeholder="Щука · 2 шт · 3,4 кг">
                </div>
            </div>

            <div class="tile">
                <label for="notes">Заметки</label>
                <textarea id="notes" name="notes" rows="3"></textarea>
            </div>

            <div class="entry__actions">
                <a class="btn btn--ghost" href="fishings.html">Отмена</a>
                <button type="submit" class="btn">Сохранить запись</button>
            </div>
        </form>
    </main>

    <footer class="site-footer">
        <p>© 2026 FishLog</p>
        <nav aria-label="Соцсети">
            <ul>
                <li><a href="#">Telegram</a></li>
                <li><a href="#">VK</a></li>
            </ul>
        </nav>
    </footer>

</body>
</html>
