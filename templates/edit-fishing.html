<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование - FishLog</title>
</head>
<body>
    <header>
        <a href="fishings.html">FishLog</a>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Выйти</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Редактирование записи</h1>

        <form action="#" method="post">
            <p>
                <label for="date">Дата</label>
                <input type="date" id="date" name="date" value="2025-09-01" required>
            </p>

            <p>
                <label for="place">Место</label>
                <input type="text" id="place" name="place" value="Исеть">
            </p>

            <p>
                <label for="temperature">Температура, °C</label>
                <input type="number" id="temperature" name="temperature" value="20" step="any">
            </p>

            <p>
                <label for="pressure">Давление, мм рт. ст.</label>
                <input type="number" id="pressure" name="pressure" value="762">
            </p>

            <p>
                <label for="wind-direction">Направление ветра</label>
                <select name="wind-direction" id="wind-direction" required>
                    <option value="">Выберите направление:</option>
                    <option value="north">Север</option>
                    <option value="northeast">Северо-Восток</option>
                    <option value="east">Восток</option>
                    <option value="southeast">Юго-Восток</option>
                    <option value="south">Юг</option>
                    <option value="southwest" selected>Юго-Запад</option>
                    <option value="west">Запад</option>
                    <option value="northwest">Северо-Запад</option>
                </select>
            </p>

            <p>
                <label for="wind-speed">Скорость ветра, м/с</label>
                <input type="number" id="wind-speed" name="wind-speed" value="2" step="any">
            </p>

            <p>
                <label for="weather">Погода</label>
                <input type="text" id="weather" name="weather" value="Солнечно">
            </p>

            <button type="submit">Сохранить изменения</button>
            <a href="fishing.html">Отмена</a>
        </form>

    </main>

    <footer>
        <p>© 2026 FishLog</p>
        <ul>
            <li><a href="#">Telegram</a></li>
            <li><a href="#">VK</a></li>
        </ul>
    </footer>
</body>
</html>
